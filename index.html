<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c5f4a">
<meta name="description" content="The Global Toddler Table — Roots Edition: A dairy-free, land-meat-free family food system for toddlers and young children.">
<title>The Global Toddler Table — Roots Edition</title>
<style>
/* ===== Design System ===== */
:root {
  --paper: #fdfaf5;
  --ink: #1a1612;
  --muted: #4a443e;
  --muted-light: #7a7268;
  --rule: #c8bdb0;
  --accent: #2c5f4a;
  --accent-light: #3d7a5f;
  --soft: #f5f1ea;
  --soft2: #f8f5ee;
  --soft3: #f0ebe1;
  --card-shadow: 0 2px 8px rgba(0,0,0,0.06);
  --header-h: 52px;
  --radius: 10px;
  --transition: 0.2s ease;
  --bottom-nav-h: 56px;
  --font-serif: Georgia, "Times New Roman", serif;
  --font-sans: Arial, Helvetica, sans-serif;
}

/* ===== Dark Mode ===== */
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #121212;
    --ink: #ececec;
    --muted: #c0c0c0;
    --muted-light: #9a9a9a;
    --rule: #4a4a4a;
    --accent: #4a8a6a;
    --accent-light: #5a9a7a;
    --soft: #1e1e1e;
    --soft2: #1a1a1a;
    --soft3: #282828;
    --card-shadow: 0 2px 8px rgba(255,255,255,0.05);
  }
}

/* ===== Shared Selector Button ===== */
.selector-btn {
  padding: 6px 12px;
  border: 2px solid var(--rule);
  border-radius: 6px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 600;
  min-height: 32px;
  transition: all 0.15s ease;
  cursor: pointer;
}
.selector-btn:hover {
  background: var(--soft);
  border-color: var(--muted-light);
}
.selector-btn.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  box-shadow: 0 2px 8px rgba(44,95,74,0.25);
}

/* ===== Component-Specific Overrides ===== */

/* Tonight filter chips — restore pill shape */
.tonight-btn {
  border-radius: 20px !important;
  padding: 8px 18px;
}

/* Age tabs — restore touch target and centering */
.age-tab {
  min-height: 40px !important;
  text-align: center;
  padding: 8px 4px;
}

/* Cat buttons — use .selector-btn defaults */
/* Batch buttons — use .selector-btn defaults */

/* ===== Reading Mode ===== */
body.reading-mode .workspace .sidebar,
body.reading-mode .dashboard,
body.reading-mode .mobile-bottom-nav,
body.reading-mode .app-header .header-actions,
body.reading-mode .app-header .search-wrap,
body.reading-mode .app-header .badge,
body.reading-mode .quick-start-grid,
body.reading-mode .daily-principle,
body.reading-mode .roots-buying-rule,
body.reading-mode .recipe-actions,
body.reading-mode .batch-scaling,
body.reading-mode .tonight-grid,
body.reading-mode #tonight-filters,
body.reading-mode .meal-day {
  display: none !important;
}
body.reading-mode .workspace .main {
  max-width: 720px;
  margin: 0 auto;
  padding: 20px;
  font-size: 18px;
  line-height: 1.62;
}
body.reading-mode .recipe-card {
  border: none;
  box-shadow: none;
  padding: 0;
  margin: 0;
}
body.reading-mode .recipe-card .recipe-meta {
  border-bottom: 1px solid var(--rule);
}
body.reading-mode .app-header .app-title {
  font-size: 18px;
}

/* ===== Print Styles ===== */
@media print {
  .app-header, .sidebar, .dashboard, .app-footer, .no-print, .mobile-bottom-nav,
  .grocery-panel, .sos-overlay, .quick-start-grid, .daily-principle,
  .roots-buying-rule, .recipe-actions, .batch-scaling {
    display: none !important;
  }
  .main {
    max-height: none !important;
    padding: 20px !important;
    margin: 0 auto !important;
    max-width: 720px !important;
    font-size: 11pt !important;
  }
  .recipe-card {
    break-inside: avoid;
    page-break-inside: avoid;
    border: none !important;
    padding: 0 !important;
    margin: 16px 0 !important;
    box-shadow: none !important;
  }
  .recipe-card .recipe-meta {
    border-bottom: 1px solid #ddd !important;
  }
  .cover-block { padding: 40px 20px !important; }
  body { background: white !important; color: black !important; }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-serif);
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; }
button { cursor: pointer; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }

/* ===== Skip Link ===== */
.skip-link {
  position: absolute;
  top: -100%;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 24px;
  background: var(--accent);
  color: #fff;
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 700;
  z-index: 1000;
  border-radius: 0 0 8px 8px;
  text-decoration: none;
}
.skip-link:focus {
  top: 0;
}

/* ===== Header ===== */
.app-header {
  position: sticky; top: 0; z-index: 50;
  height: var(--header-h);
  display: flex; align-items: center; gap: 10px;
  padding: 0 12px;
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
}
.badge {
  background: var(--accent); color: #fff;
  font-family: var(--font-sans);
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  padding: 4px 8px; border-radius: 4px;
}
.app-title {
  font-family: var(--font-sans);
  font-size: 15px; font-weight: 700; color: var(--accent);
  margin: 0;
}
.search-wrap { flex: 1; max-width: 320px; position: relative; }
.search-wrap input {
  width: 100%; padding: 7px 10px 7px 34px;
  border: 1px solid var(--rule); border-radius: 6px;
  background: var(--soft);
  font-size: 13px;
  color: var(--ink);
}
.search-wrap input:focus { outline: none; border-color: var(--accent); }
.search-wrap input::placeholder { color: var(--muted-light); }
.header-actions { display: flex; gap: 6px; align-items: center; }

.btn-tools, .print-btn, .btn-grocery, .btn-sos, .btn-reading {
  padding: 6px 10px;
  border: 1px solid var(--rule);
  border-radius: 6px;
  background: #fff;
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 600;
  min-height: 36px;
  transition: var(--transition);
}
.btn-sos { background: #fdf0e6; border-color: #d4a574; color: #5a3a2a; }
.btn-sos:hover { background: #f5e6d6; }
.btn-reading { background: var(--soft2); border-color: var(--rule); }
.btn-reading:hover { background: var(--soft3); }
.btn-reading.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-grocery:hover, .btn-tools:hover, .print-btn:hover { background: var(--soft); }

/* ===== Layout ===== */
.workspace { display: flex; min-height: calc(100vh - var(--header-h)); }
.sidebar {
  width: 280px; flex-shrink: 0;
  background: var(--soft2);
  border-right: 1px solid var(--rule);
  max-height: calc(100vh - var(--header-h));
  overflow-y: auto;
}
.sidebar-head { padding: 12px; border-bottom: 1px solid var(--rule); background: var(--soft3); }
.sidebar-head h2 { font-family: var(--font-sans); font-size: 10px; color: var(--accent); text-transform: uppercase; margin-bottom: 8px; }
.cat-row { display: flex; flex-wrap: wrap; gap: 6px; }
.nav-list { padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  text-align: left; padding: 8px 12px; border: none; border-radius: 6px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  width: 100%;
  min-height: 36px;
  border-left: 3px solid transparent;
  transition: all 0.15s ease;
}
.nav-item:hover { background: var(--soft); }
.nav-item.active {
  background: var(--accent);
  color: #fff;
  border-left-color: #fff;
  box-shadow: 0 2px 8px rgba(44,95,74,0.2);
}
.search-result-count { padding: 4px 10px 8px; font-size: 11px; color: var(--muted); font-family: var(--font-sans); }

.main {
  flex: 1; padding: 20px 24px 80px;
  max-width: 860px; margin: 0 auto;
  max-height: calc(100vh - var(--header-h));
  overflow-y: auto;
}
.main h1, .main h2, .main h3 { font-family: var(--font-sans); color: var(--accent); }
.main h1 { font-size: 22px; }
.main h2 { font-size: 16px; border-bottom: 2px solid var(--soft); padding-bottom: 6px; margin: 22px 0 8px; }
.main p { margin: 0 0 10px; }
.callout {
  border-left: 4px solid var(--accent);
  background: var(--soft2);
  padding: 12px 16px; margin: 12px 0; border-radius: 0 6px 6px 0;
  font-size: 13px;
  color: var(--ink);
}
.philosophy-block {
  font-size: 14px;
  color: var(--accent);
  font-style: italic;
  padding: 12px 0;
  text-align: center;
  max-width: 32em;
  margin: 8px auto;
}
table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 12px 0; }
th, td { border: 1px solid var(--rule); padding: 6px 8px; text-align: left; }
th { background: var(--soft3); font-family: var(--font-sans); font-weight: 600; }
.cover-block { text-align: center; padding: 28px 12px 20px; }
.cover-block .title { font-family: var(--font-sans); font-size: 26px; font-weight: 800; color: var(--accent); }
.cover-block .subtitle { font-family: var(--font-sans); font-size: 18px; font-weight: 700; }
.cover-block .tag { font-size: 13px; color: var(--muted); }
.cover-block .motto { font-style: italic; font-size: 15px; color: var(--accent); margin-top: 18px; padding: 12px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); display: inline-block; }

/* ===== Quick Start Cards ===== */
.quick-start-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin: 16px 0;
}
.quick-start-card {
  background: #fff;
  border: 2px solid var(--rule);
  border-radius: var(--radius);
  padding: 18px 14px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  min-height: 100px;
  color: var(--ink);
}
.quick-start-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  border-color: var(--accent);
}
.quick-start-card .icon { font-size: 32px; display: block; margin-bottom: 6px; }
.quick-start-card .label { font-family: var(--font-sans); font-size: 14px; font-weight: 700; color: var(--accent); }
.quick-start-card .desc { font-size: 11px; color: var(--muted); margin-top: 4px; }

/* ===== Roots Buying Rule ===== */
.roots-buying-rule {
  background: var(--soft2);
  border: 1px solid #d4a574;
  border-radius: var(--radius);
  padding: 14px 18px;
  margin: 12px 0;
}
.roots-buying-rule .rule-label {
  font-family: var(--font-sans);
  font-size: 9px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: #8b6b4a; display: block; margin-bottom: 2px;
}
.roots-buying-rule .rule-text {
  font-size: 14px; color: var(--accent);
}

/* ===== Daily Principle ===== */
.daily-principle {
  background: var(--soft2);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 14px 18px;
  margin: 16px 0 0;
  text-align: center;
}
.daily-principle .principle-label {
  font-family: var(--font-sans);
  font-size: 9px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--muted-light); display: block; margin-bottom: 4px;
}
.daily-principle .principle-text {
  font-size: 14px; color: var(--accent); font-style: italic;
}

/* ===== Recipe Cards ===== */
.recipe-card {
  background: #fff;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin: 16px 0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  color: var(--ink);
  transition: all 0.2s ease;
}
.recipe-card:hover {
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
}
.recipe-card h2 {
  border-bottom: 2px solid var(--soft);
  padding-bottom: 8px;
  margin: 0 0 4px;
  font-size: 20px;
  color: var(--accent);
}
.quick-badge {
  background: #fdf0e6; color: #5a3a2a;
  font-family: var(--font-sans);
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 4px;
  margin-left: 8px;
}
.recipe-meta {
  display: flex; flex-wrap: wrap;
  gap: 6px 12px;
  font-size: 12px;
  color: var(--muted);
  padding-bottom: 10px;
  border-bottom: 1px solid var(--soft3);
  margin-bottom: 12px;
}
.badge-tag {
  background: var(--soft);
  padding: 3px 10px;
  border-radius: 4px;
  font-weight: 600;
  font-size: 11px;
  color: var(--muted);
}
.badge-tag.dietary { background: #e6f0ea; color: #1a4a3a; }
.badge-tag.allergen { background: #f5e6e6; color: #6a2a2a; }
.badge-tag.time { background: #e6edf5; color: #1a3a5a; }

.ingredients-list {
  list-style: none;
  padding: 0;
  margin: 0 0 12px 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px 16px;
}
@media (max-width: 600px) {
  .ingredients-list { grid-template-columns: 1fr; }
}
.ingredients-list li {
  padding: 4px 0 4px 24px;
  position: relative;
  border-bottom: none;
  font-size: 14px;
  color: var(--ink);
}
.ingredients-list li::before {
  content: "•";
  position: absolute;
  left: 4px;
  color: var(--accent);
  font-weight: 700;
  font-size: 18px;
}

.method-text {
  font-size: 14px;
  line-height: 1.7;
  color: var(--ink);
  padding: 8px 0;
}
.method-text p { margin: 0 0 8px 0; }

.safety-note {
  background: var(--soft2);
  border-radius: 6px;
  padding: 12px 16px;
  border-left: 4px solid var(--accent);
  margin: 12px 0;
  font-size: 13px;
  color: var(--ink);
}

.recipe-actions {
  display: flex;
  gap: 8px;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--soft3);
  flex-wrap: wrap;
}
.btn-favorite, .btn-grocery-add {
  padding: 8px 18px;
  border: 2px solid var(--rule);
  border-radius: 6px;
  background: #fff;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 600;
  min-height: 40px;
  color: var(--ink);
  transition: all 0.15s ease;
}
.btn-favorite:hover, .btn-grocery-add:hover {
  background: var(--soft);
  border-color: var(--muted-light);
}
.btn-favorite.active {
  background: #fdf0e6;
  border-color: #d4a574;
  color: #5a3a2a;
}
.btn-grocery-add.added {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

/* ===== Batch Scaling ===== */
.batch-scaling {
  background: var(--soft);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 10px 14px;
  margin: 10px 0;
}
.batch-scaling .batch-label {
  font-family: var(--font-sans);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
  display: block;
  margin-bottom: 4px;
}
.batch-scaling .batch-controls {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}
.batch-btn {
  /* uses .selector-btn via class in HTML */
}

/* ===== Tonight Mode ===== */
.tonight-grid {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin: 12px 0;
}
.tonight-btn {
  /* uses .selector-btn via class in HTML, plus override above */
}

/* ===== Dashboard ===== */
.dashboard {
  width: 320px; flex-shrink: 0;
  background: var(--soft2);
  border-left: 1px solid var(--rule);
  padding: 14px; display: flex; flex-direction: column; gap: 14px;
  max-height: calc(100vh - var(--header-h));
  overflow-y: auto;
}
.dashboard.collapsed { width: 0; padding: 0; opacity: 0; overflow: hidden; border: none; }
.card {
  background: #fff;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 12px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  color: var(--ink);
}
.card h3 { font-family: var(--font-sans); font-size: 11px; color: var(--accent); text-transform: uppercase; margin: 0 0 6px; }
.age-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 8px; }
.age-tab {
  /* uses .selector-btn via class in HTML, plus override above */
}
.age-note { font-size: 11px; background: var(--soft); border-left: 4px solid var(--accent); padding: 8px 10px; border-radius: 0 5px 5px 0; }

.meal-day {
  display: flex; justify-content: space-between;
  padding: 10px 14px;
  margin-bottom: 4px;
  border-radius: 6px;
  background: var(--soft);
  border: 1px solid var(--rule);
  font-size: 13px;
  cursor: pointer;
  min-height: 40px;
  color: var(--ink);
  transition: all 0.15s ease;
}
.meal-day:hover {
  background: #e8e0d6;
  transform: translateX(3px);
}
.meal-day strong { color: var(--accent); font-family: var(--font-sans); }

.check-row {
  display: flex; align-items: flex-start; gap: 8px;
  font-size: 12px; padding: 6px 4px; cursor: pointer;
  min-height: 32px;
  color: var(--ink);
}
.check-row.done span { text-decoration: line-through; color: var(--muted); }
.progress { font-size: 10px; font-weight: 700; background: var(--soft); padding: 2px 6px; border-radius: 4px; color: var(--accent); }

.checkpoints {
  font-size: 13px;
  color: var(--ink);
  padding-left: 0;
  list-style: none;
}
.checkpoints li {
  padding: 4px 0 4px 24px;
  position: relative;
}
.checkpoints li::before {
  content: "✓";
  position: absolute;
  left: 0;
  color: var(--accent);
  font-weight: 700;
}

/* ===== Grocery List ===== */
.grocery-panel {
  position: fixed; top: var(--header-h); right: 0; bottom: 0;
  width: min(100%, 420px);
  background: var(--paper);
  box-shadow: -4px 0 24px rgba(0,0,0,0.12);
  z-index: 75;
  transform: translateX(105%);
  transition: transform 0.3s ease;
  display: flex; flex-direction: column;
}
.grocery-panel.open { transform: translateX(0); }
.grocery-panel .grocery-header {
  padding: 14px 16px; border-bottom: 1px solid var(--rule);
  display: flex; justify-content: space-between; align-items: center;
  background: var(--soft2); flex-shrink: 0;
}
.grocery-panel .grocery-header h2 { font-family: var(--font-sans); font-size: 14px; color: var(--accent); margin: 0; }
.grocery-panel .grocery-header .close-grocery {
  background: none; border: none; font-size: 20px; color: var(--muted);
  min-height: 36px; min-width: 36px;
}
.grocery-panel .grocery-body { flex: 1; overflow-y: auto; padding: 12px 16px; }
.grocery-aisle {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--muted); padding: 10px 0 4px; border-bottom: 1px solid var(--soft3); margin-top: 8px;
}
.grocery-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 4px;
  border-bottom: 1px solid var(--soft3);
  font-size: 14px;
  min-height: 44px;
  color: var(--ink);
  cursor: pointer;
}
.grocery-item input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: var(--accent);
  cursor: pointer;
}
.grocery-text.checked { text-decoration: line-through; color: var(--muted); }
.grocery-count {
  background: var(--soft); color: var(--muted);
  padding: 0 6px; border-radius: 3px; font-size: 10px; font-weight: 600;
}
.grocery-source { font-size: 10px; color: var(--muted-light); margin-left: auto; }

.grocery-actions {
  padding: 12px 16px; border-top: 1px solid var(--rule);
  display: flex; gap: 8px; flex-shrink: 0; background: var(--soft2); flex-wrap: wrap;
}
.grocery-actions button {
  padding: 8px 16px;
  border: 1px solid var(--rule);
  border-radius: 6px;
  background: #fff;
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 600;
  min-height: 36px;
  color: var(--ink);
  transition: all 0.15s ease;
}
.grocery-actions button:hover { background: var(--soft); }
.grocery-actions .btn-clear-all { color: #6a2a2a; border-color: #e6c5c5; }
.grocery-actions .btn-export { background: var(--accent); color: #fff; border-color: var(--accent); }

.empty-state {
